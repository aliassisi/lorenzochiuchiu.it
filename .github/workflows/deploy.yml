name: Deploy production

# Uploads main to an FTP folder over FTPS.
# PR previews still use the gh-pages branch. See preview.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude 'CLAUDE.md' --exclude '.gitignore' --exclude '.nojekyll' --exclude '_site' ./ _site/

      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: _site/
          server-dir: ${{ vars.FTP_DIR || './' }}
